<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <title>Document</title>
</head>
<style>
    .link-title:hover {
        color: skyblue !important
    }
</style>
<body>
    <main class="container">
        <h1>
            <a href="/" style="text-decoration: none; color: inherit">
                {{ keyword }} 잡서치 결과
            </a>
        </h1>
        <div>
            <a href="/file?keyword={{ keyword }}&page={{ page }}{% for site in sites %}&sites={{ site }}{% endfor %}">
                <button>
                    CSV 다운로드
                </button>
            </a>
        </div>
        <div style="margin-top: 20px; text-align: center;">
            {% if page > 1 %}
                <a href="/search?keyword={{ keyword }}&page={{ page - 1 }}{% for site in sites %}&sites={{ site }}{% endfor %}" style="text-decoration: none;">
                    <button>이전</button>
                </a>
            {% endif %}

            <span style="margin: 0 15px;">
                {{ page }} 페이지
            </span>

            <a href="/search?keyword={{ keyword }}&page={{ page + 1 }}{% for site in sites %}&sites={{ site }}{% endfor %}" style="text-decoration: none;">
                <button>다음</button>
            </a>
        </div>
        <table>
            <tr>
                <td>No.</td>
                <td>회사</td>
                <td>공고제목</td>
                <td>위치</td>
            </tr>
            {% for index, job in jobs %}
            <tr>
                <td>{{ index + 1 }}</td>
                <td>
                    {{ job['company'] }}
                </td>
                <td>
                    <a class="link-title" href="{{ job['link'] }}" target="_blank" style="text-decoration: none; color: inherit;">
                        {{ job['title'] }}
                    </a>
                </td>
                <td>{{ job['location'] }}</td>
            </tr>
            {% endfor %}
        </table>
    </main>
</body>
</html>
